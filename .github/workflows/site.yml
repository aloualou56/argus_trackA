# Builds the game on every push to main and publishes the finished site (web/dist, a few MB) to
# the "site" branch: one commit, replaced each time. The Raspberry Pi that serves the game follows
# that branch (tools/pi/README.md), so it never builds anything itself. Nothing is published if a
# test fails, and the private snapshots never leave the repository: only the built site does.
#
# The site is also served by GitHub Pages (from the "site" branch), which has no Raspberry Pi behind it:
# so each build copies the newest from ARGUS (the Pi's live/argus-now.json, written every 2 hours) into
# the site, and the build runs again every night for that (and on every push to main). If the Pi cannot be reached, the copy from
# the last build is kept; with neither, the game simply shows no live data (as offline).
name: Build the site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *" # once a night, 23:00 UTC: 01:00 in Greece in winter, 02:00 in summer (GitHub may be a few minutes late)

permissions:
  contents: write # to push the "site" branch

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Data tests
        run: python -I -m unittest discover -s tools/tests -t tools

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Web tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build

      - name: The newest from ARGUS, from the Pi
        env:
          # the Pi's address is a repository secret: never in the code, masked in the logs
          PI_LIVE_URL: ${{ secrets.PI_LIVE_URL }}
        run: |
          mkdir -p web/dist/live
          ok() { python3 -I -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); sys.exit(0 if d.get('schema')==1 and isinstance(d.get('sites'), dict) else 1)" "$1"; }
          # (curl -fs: an error does not print the address)
          if [ -n "$PI_LIVE_URL" ] && curl -fs --max-time 30 -o web/dist/live/argus-now.json "$PI_LIVE_URL" && ok web/dist/live/argus-now.json; then
            echo "live data taken from the Pi"
          else
            rm -f web/dist/live/argus-now.json
            git fetch -q --depth=1 origin site 2>/dev/null && git show FETCH_HEAD:live/argus-now.json > web/dist/live/argus-now.json 2>/dev/null && ok web/dist/live/argus-now.json               && echo "the Pi could not be reached: the last build's live data kept"               || { rm -f web/dist/live/argus-now.json; echo "no live data (the game shows none)"; }
          fi

      - name: Publish to the "site" branch
        working-directory: web/dist
        run: |
          echo "${GITHUB_SHA}" > VERSION
          git init -q -b site
          git add -A
          git -c user.name="site build" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Site built from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
