# nginx site for the game on the Raspberry Pi: static files only, on port 8080 (the playit
# tunnel points here). Installed as /etc/nginx/sites-available/guardian (tools/pi/README.md).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /var/www/guardian;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Built files carry a content hash in their name: they never change, keep them a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Everything else (the page, the service worker, the data pack, icons) is checked again on
    # every visit, so a new version shows at once; unchanged files cost a short "not modified".
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
}
